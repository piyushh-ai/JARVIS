name: ESP32 Voice Regression Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/esp32-voice-v16-session-audio"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/jarvis_build
          GEMINI_API_KEY: test-placeholder
          ESP32_TOKEN_PEPPER: test-placeholder-pepper
          SESSION_SECRET: test-placeholder-session-secret
